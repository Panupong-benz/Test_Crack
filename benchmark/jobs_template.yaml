# Job queue template — vast.ai RTX 5090.
# The REAL queue is generated by make_jobs.py AFTER the smoke hour
# (batch sizes measured there):
#   python benchmark/make_jobs.py --data-root data --out jobs.yaml --batch <B>
#   python benchmark/queue_runner.py --jobs jobs.yaml --poweroff
# This template is only the Phase-4a smoke ladder, runnable as-is on a fresh
# instance (paths = Test_Crack repo root, data/ symlinked by setup_benchmark.sh).
jobs:
  # ---- Phase 4a: smoke hour --------------------------------------------
  - name: smoke_eval_unit
    cmd: python benchmark/eval_masks.py --selftest
  - name: smoke_unet
    after: smoke_eval_unit
    cmd: python benchmark/train_seg.py --arch unet --data data/fold_RW20
         --out runs/smoke_unet --seed 0 --batch 8 --smoke 50
  - name: smoke_segformer
    after: smoke_unet
    cmd: python benchmark/train_seg.py --arch segformer --data data/fold_RW20
         --out runs/smoke_segformer --seed 0 --batch 8 --smoke 50
  - name: smoke_deeplab
    after: smoke_segformer
    cmd: python benchmark/train_seg.py --arch deeplabv3p --data data/fold_RW20
         --out runs/smoke_deeplab --seed 0 --batch 8 --smoke 50
  # SAM3-LoRA smoke: tiny-fold 1-epoch probe via the existing script
  # (REPO_DIR/SRC_FOLD configurable at the top of smoke_test.sh)
  - name: smoke_sam3
    after: smoke_deeplab
    cmd: bash smoke_test.sh

  # ---- Phases 4b-4e live in the GENERATED jobs.yaml (make_jobs.py):
  #   a6_RW20_s0 (kill-gate) -> infer -> eval -> remaining a6 (11) ->
  #   a5 x 4 folds -> a2/a3/a4 x 4 x 3 (train->predict->eval) ->
  #   a1 nnU-Net per fold (to_nnunet -> plan -> train 250ep -> predict -> eval)
