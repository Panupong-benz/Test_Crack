# Job queue template — vast.ai RTX 5090.
# The REAL queue is generated by make_jobs.py AFTER the smoke hour
# (batch sizes measured there):
#   python3 benchmark/make_jobs.py --data-root data --out jobs.yaml --batch <B>
#   python3 benchmark/queue_runner.py --jobs jobs.yaml --poweroff
# This template is only the Phase-4a smoke ladder, runnable as-is on a fresh
# instance (paths = Test_Crack repo root, data/ symlinked by setup_benchmark.sh).
jobs:
  # ---- Phase 4a: smoke hour --------------------------------------------
  - name: smoke_eval_unit
    cmd: python3 benchmark/eval_masks.py --selftest
  - name: smoke_unet
    after: smoke_eval_unit
    cmd: python3 benchmark/train_seg.py --arch unet --data data/fold_RW20
         --out runs/smoke_unet --seed 0 --batch 8 --smoke 50
  - name: smoke_segformer
    after: smoke_unet
    cmd: python3 benchmark/train_seg.py --arch segformer --data data/fold_RW20
         --out runs/smoke_segformer --seed 0 --batch 8 --smoke 50
  - name: smoke_deeplab
    after: smoke_segformer
    cmd: python3 benchmark/train_seg.py --arch deeplabv3p --data data/fold_RW20
         --out runs/smoke_deeplab --seed 0 --batch 8 --smoke 50
  # A2-A4 inference tail: predict_seg's only other execution is hours into
  # the paid queue, so prove the pipe here on 3 images off the 50-step probe
  # checkpoint (Amendment A1.5). The scores are meaningless by construction;
  # missing predictions are scored as empty with a WARNING, which is expected.
  - name: smoke_predict
    after: smoke_deeplab
    cmd: python3 benchmark/predict_seg.py --run runs/smoke_unet
         --fold data/fold_RW20 --out runs/smoke_unet/masks --limit 3
  - name: smoke_eval_real
    after: smoke_predict
    cmd: python3 benchmark/eval_masks.py --gt data/fold_RW20/test
         --pred runs/smoke_unet/masks
         --out results/benchmark/smoke_eval.csv
         --marked-list marked_line_images.txt

  # SAM3-LoRA smoke: tiny-fold 1-epoch probe via the existing script
  # (REPO_DIR/SRC_FOLD configurable at the top of smoke_test.sh)
  - name: smoke_sam3
    after: smoke_eval_real
    cmd: bash smoke_test.sh

  # ---- Phases 4b-4e live in the GENERATED jobs.yaml (make_jobs.py):
  #   a6_RW20_s0 (kill-gate) -> infer -> eval -> remaining a6 (11) ->
  #   a5 x 4 folds -> a2/a3/a4 x 4 x 3 (train->predict->eval) ->
  #   a1 nnU-Net per fold (to_nnunet -> plan -> train 250ep -> predict -> eval)
