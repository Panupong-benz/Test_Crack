# A6-only smoke ladder (Amendment A1.8) — the interim rental trains only our
# SAM3-LoRA, whose batch is FIXED in the config (micro 2 x accum 8), so there
# is no batch sweep: the smoke's whole job is to prove the pipe and print the
# s/step that the runbook's hour formula consumes before the queue is released.
#   bash run_benchmark.sh smoke-a6
#   BM_GPUS=2 bash run_benchmark.sh smoke-a6     # A1.27: smoke_test.sh and
#       smoke_resume.py read BM_DEVICES ("0 1") and hand the trainer
#       --device 0 1, so the pipe is proven at the world size the queue
#       will use (make_jobs --gpus 2 bakes the same flag into jobs.yaml).
# The full 4a ladder (jobs_template.yaml) stays for the shelved baseline grid.
jobs:
  - name: smoke_eval_unit
    cmd: python3 benchmark/eval_masks.py --selftest
  # tiny-fold 1-epoch probe through the SAME config the queue trains with
  # (A1.4 item: FULL_CONFIG == make_jobs --base-config default)
  - name: smoke_sam3
    after: smoke_eval_unit
    cmd: bash smoke_test.sh
  # A1.22: exact-resume proof on the REAL trainer + GPU (AdamW8bit state
  # round-trip cannot be tested on the dev box). Resumes the 1-epoch smoke to
  # 2 epochs, runs a straight 2-epoch twin, asserts identical epoch-2 data
  # fingerprints. ~2 extra smoke epochs. Must PASS before `full`.
  - name: smoke_resume
    after: smoke_sam3
    cmd: python3 benchmark/smoke_resume.py
  # A1.24: the A5/A6 inference path had NEVER been executed - infer_sam
  # requires --config and the shim never passed it, so job 3 of the real
  # queue (non-optional, right after ~22 h of pilot training) would have
  # died on argparse. These four jobs run that whole path on 2 smoke images
  # in ~3-5 min, before any money is committed.
  - name: smoke_infer_a6
    after: smoke_resume
    cmd: python3 benchmark/run_a5_zeroshot.py --fold /workspace/smoke/smoke_fold
      --out /workspace/smoke/m_a6 --limit 2
      --weights outputs/sam3_lora_full/best_lora_weights.pt
  - name: smoke_infer_a5
    after: smoke_infer_a6
    cmd: python3 benchmark/run_a5_zeroshot.py --fold /workspace/smoke/smoke_fold
      --out /workspace/smoke/m_a5 --limit 2
  # infer -> _mask.png -> eval, end to end. Written OUTSIDE results/benchmark
  # so summarize's eval_* glob never sees it (the A1.6 item 48 trap).
  - name: smoke_eval_real
    after: smoke_infer_a5
    cmd: python3 benchmark/eval_masks.py --gt /workspace/smoke/smoke_fold/test
      --pred /workspace/smoke/m_a6 --out /workspace/smoke/eval_probe.csv
  # the one check that catches BOTH silent failures: if the LoRA weights did
  # not reach the model, A6 and A5 masks come out identical. MUST PASS.
  - name: smoke_lora_effect
    after: smoke_eval_real
    cmd: python3 benchmark/check_lora_effect.py --a6 /workspace/smoke/m_a6
      --a5 /workspace/smoke/m_a5
